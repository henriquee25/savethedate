<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date | Isabeli Kraschinski</title>
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Fontes nobres e delicadas (Estilo Bridgerton) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Áudio Ambiente (Young and Beautiful - Lana Del Rey) -->
    <audio id="musicaFundo" loop>
        <source src="young-and-beautiful.mp3" type="audio/mpeg">
    </audio>

    <!-- Fundo (Vídeo ou Imagem) -->
    <div class="video-container">
        <video autoplay muted loop playsinline id="videoFundo">
            <source src="seu-video.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <!-- Tela de Entrada -->
    <div id="telaEntrada" class="tela-entrada">
        <div class="ornamento-floral">🌸</div>
        <p class="subtitulo-entrada">SAVE THE DATE • 15 ANOS</p>
        <h1 class="titulo-entrada">Isabeli Kraschinski</h1>
        <p class="instrucao-entrada">Ligue o som e toque para abrir</p>
        <button id="btnEntrar" class="btn-entrar">
            <span>Entrar no Jardim</span>
        </button>
    </div>

    <!-- Conteúdo Principal -->
    <main id="conteudoPrincipal" class="escondido">
        <div class="cartao-bridgerton">
            <div class="moldura-interna">
                <span class="detalhe-topo">🌸 XV ANOS 🌸</span>
                
                <p class="pre-titulo">SAVE THE DATE</p>
                <h2 class="nome-debutante">Isabeli Kraschinski</h2>
                
                <div class="divisor-brilho">
                    <span>✨</span>
                </div>
                
                <div class="bloco-data">
                    <p class="data-evento">16 . 01 . 2027</p>
                </div>

                <!-- Contagem Regressiva -->
                <div class="contagem-container">
                    <p class="titulo-contagem">FALTAM APENAS</p>
                    <div class="countdown">
                        <div class="time-block">
                            <span class="number" id="dias">00</span>
                            <span class="label">Dias</span>
                        </div>
                        <div class="time-block">
                            <span class="number" id="horas">00</span>
                            <span class="label">Horas</span>
                        </div>
                        <div class="time-block">
                            <span class="number" id="minutos">00</span>
                            <span class="label">Min</span>
                        </div>
                        <div class="time-block">
                            <span class="number" id="segundos">00</span>
                            <span class="label">Seg</span>
                        </div>
                    </div>
                </div>

                <p class="aviso-save-date">Guarde esta data com carinho.<br><span>Convite oficial em breve.</span></p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
