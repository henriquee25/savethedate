<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isabeli · 15 anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- CSS vem no passo 2, no lugar deste comentário -->
</head>
<body class="locked">

<!-- pétalas caindo, geradas via JS -->
<div id="bg" aria-hidden="true"></div>
<div id="petals" aria-hidden="true"></div>

<!-- ===== TELA DE ABERTURA (capa) ===== -->
<div class="opener" id="opener">
  <div class="panel left"></div>
  <div class="panel right"></div>
  <div class="opener-center" id="openerCenter">
    <p class="opener-label">um convite especial para você de</p>
    <h2 class="opener-name">Isabeli</h2>
    <button class="open-btn" id="openBtn" type="button">
      <span class="seal">✦</span> toque para abrir o convite
    </button>
  </div>
</div>

<!-- ===== CONVITE PRINCIPAL ===== -->
<div class="stage">

  <main class="card" id="card">
    <p class="overline">guarde a data</p>

    <h1 class="name">
      <span class="first">Isabeli</span>
      <span class="last">Kraschinski</span>
    </h1>

    <p class="subtitle">celebrando os meus quinze anos</p>

    <p class="date-line">16 <span class="sep">·</span> janeiro <span class="sep">·</span> 2027</p>

    <div class="countdown" id="countdown" aria-live="polite">
      <div class="count-unit">
        <span class="count-num" id="cd-days">–</span>
        <span class="count-label">dias</span>
      </div>
      <span class="count-divider">·</span>
      <div class="count-unit">
        <span class="count-num" id="cd-hours">–</span>
        <span class="count-label">horas</span>
      </div>
      <span class="count-divider">·</span>
      <div class="count-unit">
        <span class="count-num" id="cd-min">–</span>
        <span class="count-label">min</span>
      </div>
      <span class="count-divider">·</span>
      <div class="count-unit">
        <span class="count-num" id="cd-sec">–</span>
        <span class="count-label">seg</span>
      </div>
    </div>

    <div class="thin-rule"></div>

    <button class="music-toggle" id="musicBtn" aria-expanded="false" aria-controls="musicWrap">
      ouvir "Young and Beautiful"
    </button>
    <div class="music-wrap" id="musicWrap">
      <iframe id="musicFrame" title="Young and Beautiful — Lana Del Rey" style="display:none" width="100%" height="80" frameborder="0" allow="autoplay; encrypted-media" loading="lazy"></iframe>
    </div>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
